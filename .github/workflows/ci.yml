name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Jobtology-BE
    steps:
      - uses: actions/checkout@v4
        with:
          path: Jobtology-BE
      - uses: actions/checkout@v4
        with:
          repository: SMU-GoodEyeDeer/Jobtology-DB
          ref: 96840cad6401ef6b2c69018959c2ddfa53984af8
          path: Jobtology-DB
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: Jobtology-BE/uv.lock
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "8.0.x"
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv lock --check
      - run: uv build
      - name: Verify installed monolith wheel and native parser assets
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes --output-file /tmp/jobtology-wheel-constraints.txt
          uv venv /tmp/jobtology-wheel-check --python 3.12
          uv pip install --python /tmp/jobtology-wheel-check/bin/python --constraint /tmp/jobtology-wheel-constraints.txt dist/*.whl
          cd /tmp
          /tmp/jobtology-wheel-check/bin/python -m jobtology_be.document_processor.runtime_check --require-all
          /tmp/jobtology-wheel-check/bin/python "$GITHUB_WORKSPACE/Jobtology-BE/experiments/resume_import/verify_processor.py" --out /tmp/jobtology-wheel-probe --native-smoke

  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      COOLIFY_URL: https://coolify.yeongmin.net
      COOLIFY_APP_UUID: w131qqclc6wyke8347y9puqo
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Skip superseded commits
        id: head
        run: |
          head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$head_sha" != "$GITHUB_SHA" ]; then
            echo "main moved to $head_sha; its own run deploys it."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy tested commit to Coolify
        if: steps.head.outputs.current == 'true'
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          auth="Authorization: Bearer ${COOLIFY_TOKEN}"
          response=$(curl --fail-with-body -sS -X POST -H "$auth" -H "Content-Type: application/json" \
            --data "$(jq -n --arg uuid "$COOLIFY_APP_UUID" '{uuid: $uuid}')" "${COOLIFY_URL}/api/v1/deploy")
          deployment=$(jq -r '.deployments[0].deployment_uuid' <<<"$response")
          echo "Coolify deployment ${deployment}"
          for _ in $(seq 1 90); do
            status=$(curl --fail-with-body -sS -H "$auth" "${COOLIFY_URL}/api/v1/deployments/${deployment}" | jq -r .status)
            case "$status" in
              finished) echo "Deployment finished"; exit 0 ;;
              failed|cancelled*) echo "Deployment ${status}"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Deployment timed out (last status: ${status})"
          exit 1
      - name: Verify product role release is loaded
        if: steps.head.outputs.current == 'true'
        run: |
          for _ in $(seq 1 12); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' https://jobtology.yeongmin.net/api/v1/occupations || true)
            if [ "$code" = "200" ]; then echo "Occupations available"; exit 0; fi
            echo "GET /api/v1/occupations -> ${code}; retrying"
            sleep 10
          done
          echo "::error::Product role release did not load (occupations ${code}). Check the app log for 'Product role release not loaded'; a changed catalog needs a new approval in config/product_roles/approvals/."
          exit 1
