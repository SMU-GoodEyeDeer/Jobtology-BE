[project]
name = "jobtology-be"
version = "0.1.0"
description = "Jobtology analysis and roadmap API"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "ortools>=9.11,<10",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "authlib>=1.8,<2",
  "httpx>=0.28,<1",
  "markdown-it-py>=3,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobtology_be"]

[tool.hatch.build.targets.wheel.force-include]
"docs/fe-integration.md" = "jobtology_be/api/guide/fe-integration.md"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.alembic]
script_location = "migrations"
prepend_sys_path = [".", "src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.basedpyright]
extraPaths = ["src"]
